services:
  db:
    image: postgres:17-alpine
    container_name: payments-db
    environment:
      - POSTGRES_USER=payments
      - POSTGRES_PASSWORD=payments
      - POSTGRES_DB=payments
    ports:
      - "5800:5432"
    mem_limit: 512m
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres:/docker-entrypoint-initdb.d:ro,Z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payments"]
      interval: 10s
      timeout: 5s
      retries: 5

  # NO volume for redis cuz it's either a cache or short lived, so restart is always fine as pg is the source of truth
  redis:
    image: redis:7-alpine
    container_name: payments-redis
    ports:
      - "6379:6379"
    mem_limit: 512m

  nats:
    image: nats:2.11-alpine
    container_name: payments-nats
    ports:
      - "4222:4222"
      - "6222:6222"
      - "8222:8222"
    mem_limit: 512m

volumes:
  pgdata:
